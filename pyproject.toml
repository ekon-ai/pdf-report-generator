[project]
name = "pdf-report-generator"
version = "0.1.0"
description = "CLI: HTML (Jinja2) template + CSV -> PDF reports (WeasyPrint), with Cyrillic font support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "rich>=13",
    "weasyprint>=60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdf_report"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
